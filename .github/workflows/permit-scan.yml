name: Permit scan

on:
  schedule:
    - cron: '17 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scan.mjs', '.github/workflows/permit-scan.yml']

permissions:
  contents: write
  issues: write

concurrency:
  group: permit-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan
        env:
          RESORT: wdw
        run: node scan.mjs

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scan
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "permit scan $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: Comment when something moved
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s data/scan/events.txt ] || { echo "quiet run"; exit 0; }
          num=$(gh issue list --state open --search "permit-log in:title" --json number,title --jq '.[] | select(.title=="permit-log") | .number' | head -1)
          if [ -z "$num" ]; then
            num=$(gh issue create --title "permit-log" --body "Changes detected by permit-scan. One comment per run that found something." | grep -oE '[0-9]+$')
          fi
          {
            echo "@scoopdisney Walt Disney World permit changes, run $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo '```'
            cat data/scan/events.txt
            echo '```'
            echo
            echo "Full history: data/scan/log.csv"
          } > comment.md
          gh issue comment "$num" --body-file comment.md
