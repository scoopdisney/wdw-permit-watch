name: Update Permit Feed

on:
  push:
    branches: [main]
    paths:
      - 'data/permits.json'
      - 'scripts/**'
  schedule:
    # Run a couple times a day so the page stays fresh even if only manual updates happen
    - cron: '0 12,0 * * *'   # 12:00 and 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Validate permits.json
        run: |
          if [ ! -f data/permits.json ]; then
            echo "data/permits.json missing"
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('data/permits.json','utf8')); console.log('JSON valid')"

      - name: Update last_updated timestamp (optional light touch)
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("data/permits.json","utf8"));
            p.last_updated = new Date().toISOString();
            fs.writeFileSync("data/permits.json", JSON.stringify(p, null, 2) + "\n");
          '

      - name: Commit any timestamp change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/permits.json
          git diff --staged --quiet || git commit -m "chore: refresh last_updated timestamp [skip ci]"
          git push
